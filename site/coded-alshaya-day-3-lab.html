<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Day 3 Lab — The Capstone Project · CODED × Alshaya</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230A0507%22%2F%3E%3Ccircle%20cx%3D%2216%22%20cy%3D%2216%22%20r%3D%227%22%20fill%3D%22%23C8324A%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#0A0507; --base2:#070406; --surf:#150A0D; --surf2:#1C0E12;
  --card:#130A0C; --card-2:#190E11; --raise:#241019; --panel:#120A0C;
  --maroon:#5D181A; --mid:#8B1E2A; --crimson:#C8324A; --rose:#E0566E; --rose-lt:#EC8B9C;
  --gold:#E9C46A; --gold-lt:#F5DFA8;
  --ink:#F5F0F1; --ink-dim:#AEA2A5; --ink-faint:#76696C;
  --w:#fff; --w8:rgba(255,255,255,.82); --w7:rgba(255,255,255,.7); --w6:rgba(255,255,255,.58);
  --w5:rgba(255,255,255,.46); --w4:rgba(255,255,255,.34); --w3:rgba(255,255,255,.3);
  --w2:rgba(255,255,255,.16); --w1:rgba(255,255,255,.09); --w06:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
  --green:#3DC873; --green-lt:#8FE6AE; --green-bg:rgba(61,200,115,.12); --green-bd:rgba(61,200,115,.4);
  --amber:#E9C46A; --ac-cyan:#6FCFE4;
  --f:'Manrope',system-ui,sans-serif; --mf:'Manrope',system-ui,sans-serif;
  --mono:'Space Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1100px 640px at 85% -8%,rgba(200,50,74,.12),transparent 60%),var(--base);
  color:var(--ink);font-family:var(--f);-webkit-font-smoothing:antialiased;line-height:1.5;
  overflow-x:hidden;display:flex;min-height:100vh}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid var(--rose);outline-offset:3px;border-radius:4px}

/* left rail */
#rail{width:290px;flex:none;border-right:1px solid var(--line);background:var(--base2);
  display:flex;flex-direction:column;height:100vh;position:sticky;top:0}
.rail-brand{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:11px}
.rail-brand .coded-logo{height:16px}
.rail-brand .x{color:var(--ink-faint);font-size:11px}
.rail-brand .partner{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--ink)}
.day-chip{margin:16px 22px 0;display:inline-flex;align-self:flex-start;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.12em;text-transform:uppercase;color:var(--rose-lt);background:rgba(200,50,74,.1);
  border:1px solid rgba(200,50,74,.3);border-radius:999px;padding:6px 12px}
.prog-wrap{margin:16px 22px 6px}
.prog-bar{height:6px;border-radius:3px;background:var(--w06);overflow:hidden}
.prog-fill{height:100%;width:0;background:linear-gradient(90deg,var(--rose),var(--crimson));transition:width .3s}
.prog-label{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-top:7px}
#navList{flex:1;overflow-y:auto;padding:12px}
.nav-item{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:3px}
.nav-item:hover{background:var(--w06)}
.nav-item.active{background:rgba(200,50,74,.12);border:1px solid rgba(200,50,74,.25)}
.nav-item .ni-n{flex:none;width:24px;height:24px;border-radius:7px;background:var(--w06);border:1px solid var(--w1);
  font-family:var(--mono);font-size:11px;font-weight:700;color:var(--rose-lt);display:flex;align-items:center;justify-content:center}
.nav-item.done .ni-n{background:var(--green-bg);border-color:var(--green-bd);color:var(--green-lt)}
.nav-item .ni-t{font-size:13px;font-weight:600;color:var(--ink);line-height:1.3}
.rail-foot{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px}
.rail-foot button{flex:1;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  padding:9px;border-radius:8px;border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);cursor:pointer}
.rail-foot button:hover{color:var(--ink)}
@media(max-width:820px){#rail{position:fixed;left:-300px;z-index:50;transition:left .2s}#rail.open{left:0}}

/* main */
#main{flex:1;min-width:0;display:flex;flex-direction:column}
#mtop{position:sticky;top:0;z-index:20;background:rgba(10,5,7,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);padding:14px 28px;display:flex;align-items:center;gap:14px}
#mtop .back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-dim);
  background:var(--w06);border:1px solid var(--w1);border-radius:8px;padding:7px 11px}
#mtop .back:hover{color:var(--ink)}
#mtop .ham{display:none}
@media(max-width:820px){#mtop .ham{display:inline-flex;background:var(--w06);border:1px solid var(--w1);border-radius:8px;padding:8px;cursor:pointer;color:var(--ink)}}
#mtop .crumb{font-family:var(--mono);font-size:12px;color:var(--ink-faint);flex:1}
#mtop .mnav{display:flex;gap:8px}
#mtop .mnav button{width:34px;height:34px;border-radius:8px;border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);cursor:pointer}
#mtop .mnav button:hover{color:var(--ink)}

#view{max-width:820px;margin:0 auto;padding:38px 28px 90px;width:100%}
.task-tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:14px}
.task-tag .app{background:rgba(200,50,74,.14);border:1px solid rgba(200,50,74,.3);border-radius:6px;padding:3px 8px}
h1.task-h{font-size:26px;font-weight:800;letter-spacing:-.3px;margin-bottom:12px}
.scn{font-size:15px;line-height:1.65;color:var(--ink-dim);margin-bottom:24px}

.step-card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--w1);border-radius:14px;padding:22px 24px;margin-bottom:18px}
.step-card .sc-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:12px}
.step-card ol{margin:0;padding-left:20px}
.step-card li{font-size:14.5px;color:var(--ink);line-height:1.55;margin-bottom:8px}
.prompt{font-family:var(--mono);font-size:13px;color:var(--ink);background:rgba(0,0,0,.28);border:1px solid var(--w1);
  border-radius:9px;padding:14px 16px;padding-right:74px;line-height:1.55;margin:14px 0;position:relative;cursor:pointer;transition:border-color .15s}
.prompt:hover{border-color:rgba(200,50,74,.4)}
.prompt .copy-tag{position:absolute;top:8px;right:10px;font-size:10px;color:var(--ink-faint);font-family:var(--mono)}
.prompt.copied{border-color:var(--green-bd)}
.prompt.copied .copy-tag{color:var(--green-lt)}

.expect{background:rgba(233,196,106,.06);border:1px solid rgba(233,196,106,.28);border-radius:12px;padding:18px 20px;margin-bottom:18px}
.expect .ex-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--amber);margin-bottom:8px}
.expect p{font-size:14px;color:var(--ink);line-height:1.55}

.capture{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.capture label{display:block;font-size:13px;font-weight:700;color:var(--ink);margin-bottom:10px}
.capture textarea{width:100%;min-height:90px;background:var(--base);border:1px solid var(--w1);border-radius:9px;
  padding:12px 14px;color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5;resize:vertical}
.capture textarea:focus{outline:none;border-color:rgba(200,50,74,.5)}
.capture .cap-row{display:flex;align-items:center;gap:12px;margin-top:12px}
.cap-btn{padding:10px 18px;border-radius:9px;border:none;font-weight:700;font-size:13.5px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--crimson),var(--maroon));box-shadow:0 6px 20px rgba(200,50,74,.3)}
.cap-btn:hover{transform:translateY(-1px)}
.cap-done{font-family:var(--mono);font-size:12px;color:var(--green-lt);display:none;align-items:center;gap:7px}
.cap-done.on{display:inline-flex}

.task-foot{display:flex;justify-content:space-between;margin-top:30px;gap:12px}
.tf-btn{padding:12px 20px;border-radius:10px;border:1px solid var(--w1);background:var(--w06);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer}
.tf-btn.next{background:linear-gradient(135deg,var(--crimson),var(--maroon));border:none;color:#fff}
.tf-btn:disabled{opacity:.4;cursor:not-allowed}

/* widgets */
.lw-tabs{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.lw-tab{padding:8px 14px;border-radius:9px;font-size:12.5px;font-weight:700;cursor:pointer;
  border:1px solid var(--w1);background:var(--w06);color:var(--ink-dim);transition:.15s}
.lw-tab.on{border-color:rgba(200,50,74,.5);color:var(--ink);background:rgba(200,50,74,.13)}
.lw-job{font-size:13.5px;color:var(--ink);line-height:1.55;margin-bottom:14px}
.lw-job b{color:var(--rose-lt)}
.lw-doc{background:rgba(0,0,0,.3);border:1px solid var(--w1);border-radius:10px;padding:12px 15px;max-height:300px;overflow:auto;margin-bottom:16px}
.lw-pre{font-family:var(--mono);font-size:11px;line-height:1.55;color:var(--ink-dim);white-space:pre-wrap;margin:0}
.lw-fields{display:flex;flex-direction:column;gap:9px}
.lw-fields input{width:100%;background:var(--base);border:1px solid var(--w1);border-radius:9px;
  padding:11px 14px;color:var(--ink);font-family:var(--f);font-size:13.5px}
.lw-fields input:focus{outline:none;border-color:rgba(200,50,74,.5)}
.lw-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:4px}
.lw-btn{padding:9px 16px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--crimson),var(--maroon))}
.lw-btn.ghost{background:var(--w06);border:1px solid var(--w1);color:var(--ink-dim)}
.lw-btn:hover{transform:translateY(-1px)}
.lw-hint{font-family:var(--mono);font-size:11px;color:var(--green-lt)}
.lw-out{width:100%;min-height:78px;margin-top:10px;background:rgba(0,0,0,.28);border:1px solid var(--w1);
  border-radius:9px;padding:12px 14px;color:var(--ink);font-family:var(--mono);font-size:12px;line-height:1.55;resize:vertical}
.lw-out:focus{outline:none;border-color:rgba(200,50,74,.5)}
.lw-test{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink);
  background:var(--w06);border:1px solid var(--w1);border-radius:9px;padding:9px 15px}
.lw-test:hover{border-color:rgba(200,50,74,.45)}
.lw-starters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lw-starters .prompt{margin:0}
@media(max-width:640px){.lw-starters{grid-template-columns:1fr}}
.lw-briefs{margin-bottom:12px}
.lw-briefs .lw-pre{background:rgba(0,0,0,.3);border:1px solid var(--w1);border-radius:10px;padding:14px 16px;
  max-height:300px;overflow:auto;cursor:pointer;transition:border-color .15s;position:relative}
.lw-briefs .lw-pre:hover{border-color:rgba(200,50,74,.4)}
.lw-briefs .lw-pre.copied{border-color:var(--green-bd)}

/* ===== Day 2 additions: dataset, findings, goal, reveal, launch ===== */
.dataset{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.dataset .ds-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--rose-lt);margin-bottom:6px}
.dataset .ds-note{font-size:13.5px;color:var(--ink-dim);line-height:1.55;margin-bottom:12px}
.dl{display:inline-flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;
  border:1px solid rgba(61,200,115,.3);background:rgba(61,200,115,.07);color:var(--ink);font-size:13.5px;font-weight:700}
.dl:hover{border-color:rgba(61,200,115,.6)}
.dl .ic{width:26px;height:26px;border-radius:7px;background:rgba(61,200,115,.16);display:flex;align-items:center;justify-content:center;font-size:13px}
.dl small{display:block;font-weight:600;font-size:11px;color:var(--ink-faint);margin-top:1px}
.ds-table-wrap{margin-top:14px;overflow-x:auto;border:1px solid var(--w1);border-radius:10px}
table.ds-table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:11.5px}
table.ds-table th{background:var(--surf2);color:var(--ink);text-align:left;padding:8px 10px;border-bottom:1px solid var(--w1);white-space:nowrap;font-weight:700}
table.ds-table td{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.05);color:var(--ink-dim);white-space:nowrap}
table.ds-table tr:last-child td{border-bottom:none}
.ds-more{font-family:var(--mono);font-size:11px;color:var(--ink-faint);padding:8px 10px}
.recap-card{background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:18px 20px;margin-bottom:18px}
.recap-pre{margin-top:10px;background:var(--surf);border:1px solid var(--w1);border-radius:10px;padding:14px 16px;
  font-family:var(--mono);font-size:11.5px;line-height:1.6;color:var(--ink-dim);white-space:pre-wrap;margin-bottom:0}
.launch-btn{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;padding:18px 22px;
  border-radius:14px;color:#fff;background:linear-gradient(135deg,var(--crimson),var(--maroon));
  box-shadow:0 8px 26px rgba(200,50,74,.3);transition:transform .16s}
.launch-btn:hover{transform:translateY(-1px)}
.launch-btn b{font-size:15.5px;display:block}
.launch-btn span.sub{font-size:13px;color:rgba(255,255,255,.82);display:block;margin-top:3px}
.launch-btn .ar{font-size:22px;flex:none}
.pstep{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--w1);border-radius:14px;padding:18px 20px;margin-bottom:14px}
.pstep-h{display:flex;align-items:center;gap:11px;font-size:14.5px;font-weight:800;color:var(--ink);margin-bottom:12px}
.pstep-n{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(200,50,74,.14);border:1px solid rgba(200,50,74,.35);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rose-lt)}
.findings{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:620px){.findings{grid-template-columns:1fr}}
.find{display:flex;flex-direction:column;gap:5px}
.find span{font-size:12px;font-weight:700;color:var(--ink-dim)}
.find-in{background:var(--base);border:1px solid var(--w1);border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--f);font-size:13.5px}
.find-in:focus{outline:none;border-color:rgba(200,50,74,.5)}
.find-in.filled{border-color:var(--green-bd)}
.findings-k{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin:2px 0 8px}
.ctft-note{margin-bottom:16px;border-left:3px solid var(--rose);background:rgba(200,50,74,.07);border-radius:0 12px 12px 0;
  padding:13px 17px;font-size:13.5px;color:var(--ink-dim);line-height:1.55}
.ctft-note b{color:var(--ink)}
.goal{background:rgba(233,196,106,.06);border:1px solid rgba(233,196,106,.28);border-radius:10px;padding:13px 16px;font-size:14.5px;color:var(--ink);line-height:1.55}
.goal .gk{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--amber);margin-bottom:6px}
details.reveal{margin-top:12px}
details.reveal>summary{cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--rose-lt);list-style:none}
details.reveal>summary::-webkit-details-marker{display:none}
details.reveal[open]>summary{color:var(--ink-dim);margin-bottom:10px}
details.reveal .prompt{margin:0}
</style>
</head>

<script>
  const TASKS = [{"app": "Team · Phase 0", "title": "T1 · Phase 0 — Choose your scenario &amp; plan", "scenario": "Ten minutes, no tools open. Find your team’s scenario below, read it twice, download your team’s workbook, and agree who does what. Teams of two: for every deliverable one of you builds, the other verifies. (~10 min)", "widget": "<div class=\"step-card\"><div class=\"sc-k\">Your seven scenarios — one per team</div><details class=\"reveal\"><summary>S1 · The Contractor Turnaround · <span style=\"color:var(--ink-dim)\">Facilities</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> The portfolio has 40 open maintenance tickets, 11 of them older than 30 days, against a 5-day service standard. Complaints have tripled in a quarter — and one contractor has quietly stopped closing tickets altogether.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A contractor performance regime: response-time standards by priority, a weekly scorecard, and a clear escalation path — so the backlog cannot build up unseen again.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s1.xlsx</b> — the full 68-ticket maintenance log, per-ticket first-response times against SLA, the contracted service levels, and thirteen weeks of site attendance.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Your briefing must name the stalled contractor from the log itself — worked out from the data, not from memory.</p><a class=\"dl\" href=\"alshaya-capstone-s1.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s1.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S2 · The Cost Control Programme · <span style=\"color:var(--ink-dim)\">Finance</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> Q3 closed with maintenance KWD 7,300 over budget and utilities KWD 2,100 over, while marketing sat KWD 2,600 under. At the same time occupancy at [PROPERTY A] is sliding — income falling while costs rise.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A Q4 cost-control programme: three concrete measures, each tied to a budget line, plus a monthly variance review so overruns surface in weeks, not quarters.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s2.xlsx</b> — the Q3 budget against actuals, twelve months of monthly cost by category, and six months of occupancy and income.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Every saving you promise must trace to a line in your workbook. A saving with no line behind it is a wish, not a measure.</p><a class=\"dl\" href=\"alshaya-capstone-s2.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s2.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S3 · The Upper-Floor Push · <span style=\"color:var(--ink-dim)\">Leasing</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> Retail occupancy at [PROPERTY A] has slid from 83.3% to 75% in six months. Twelve units sit vacant — five empty for nine months or more, concentrated on the upper floor. A new F&amp;B signing should lift footfall next quarter.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> An upper-floor leasing campaign: targeted incentives funded by the marketing underspend, a occupancy target, and a 90-day plan that rides the F&amp;B opening.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s3.xlsx</b> — six months of occupancy and income, the unit-by-unit schedule for all 48 units with use and lease expiry, and six months of leasing enquiries with outcomes.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Occupancy numbers travel fast. Count the units yourself before any percentage reaches your briefing.</p><a class=\"dl\" href=\"alshaya-capstone-s3.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s3.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S4 · The Hiring Sprint · <span style=\"color:var(--ink-dim)\">HR</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> [PROPERTY C] — a 14-unit tower — is approaching completion, and the facilities team that will run it does not exist yet. Twelve candidates across four roles are sitting in a sheet, unscreened.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A 60-day structured hiring sprint: clear criteria per role, an AI-assisted screening workflow, and an interview plan — staffed and ready before the building opens.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s4.xlsx</b> — the agreed role requirements, the 40-candidate register, the agency’s long-list of the same pool, and eight weeks of application volume by source.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> AI screens, humans decide. Your package must say — explicitly — where the human decision sits in the workflow.</p><a class=\"dl\" href=\"alshaya-capstone-s4.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s4.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S5 · The Engagement Turnaround · <span style=\"color:var(--ink-dim)\">HR · People</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> The staff survey is back: Maintenance and HR trail Leasing and Finance, and Growth Opportunities is the weakest score across every department. Twelve responses — small enough that every voice counts, small enough to overread.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A 90-day engagement plan: two actions aimed at the weakest scores, an owner for each, and a follow-up pulse survey to prove movement.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s5.xlsx</b> — this year’s 12 scored responses with their free-text comments, last year’s survey for the trend, twelve months of exit interviews, and training hours by department.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Twelve responses is a small sample. Your briefing should say what the data supports — and admit what it cannot.</p><a class=\"dl\" href=\"alshaya-capstone-s5.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s5.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S6 · The Tenant Confidence Campaign · <span style=\"color:var(--ink-dim)\">Communications</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> Tenant complaints tripled from 9 to 23 in a month. The north lift keeps failing, three tenants have escalated in writing, and one is asking about a rent concession. Today, tenants hear nothing until something breaks.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A proactive tenant communication programme: a monthly operations note, planned-works notices, a published service standard, and a complaint-response SLA.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s6.xlsx</b> — six months of tenant complaints (60 in all, ticket-linked from April), plus the full maintenance log for verifying every linked ticket.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Honest without being alarming. Never promise a date or a fix the data cannot support — that is how confidence was lost in the first place.</p><a class=\"dl\" href=\"alshaya-capstone-s6.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s6.xlsx</small></span></a></div></details><details class=\"reveal\"><summary>S7 · The Launch Readiness Plan · <span style=\"color:var(--ink-dim)\">Operations</span></summary><div style=\"padding:4px 2px 8px\"><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>The situation.</b> [PROPERTY C] is a 14-unit tower in fit-out trouble: joinery arrived late, the contractor needs six weeks from delivery, the tenant is paying storage while they wait, and the Board wants a written position on the handover date.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your initiative.</b> A launch-readiness plan: a realistic handover date you can defend, the top five risks with owners, and a week-by-week countdown to opening.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0\"><b>Your data.</b> Your workbook <b>alshaya-capstone-s7.xlsx</b> — the confirmed project facts, the contractor’s milestone schedule, the 28-item snag list, the fit-out cost tracker against contingency, and the portfolio occupancy context.</p><p style=\"font-size:14px;line-height:1.6;margin:10px 0;color:var(--gold-lt)\"><b>Watch out.</b> Dates need the same checks as money. Run the arithmetic across every milestone yourself before you commit to a date.</p><a class=\"dl\" href=\"alshaya-capstone-s7.xlsx\" download style=\"margin:6px 0 4px\"><span class=\"ic\">⬇</span><span>Download your workbook<small>alshaya-capstone-s7.xlsx</small></span></a></div></details><p style=\"font-size:13.5px;line-height:1.6;margin:14px 2px 2px;color:var(--gold-lt)\"><b>Every workbook contains exactly one planted inconsistency</b> — between its sheets, or against its own totals. Your verifier’s first job is to find it before it reaches your briefing. Flag it in your pitch; do not silently pick a side.</p></div>", "steps": ["Find your team’s scenario below (your instructor assigns S1–S7) and read it together.", "Open the data your scenario names and skim it — know what is in there before you prompt.", "Split the roles: for each deliverable, one builder, one verifier. Swap as you go.", "Agree the order of work and who presents what. Write it in the capture box."], "findings": [{"label": "Your scenario", "hint": "S1–S7 + its name"}, {"label": "Who builds / who verifies, per deliverable", "hint": "initials are enough"}], "expect": "A scenario you both understand, the data open on one screen, and a role split written down. No deliverable started — that is the point of Phase 0.", "stretch": "Write the one-sentence version of your recommendation now, before any analysis. At the end, check: did the data change your mind?", "boss": "Name the single number in your data most likely to sink the initiative if it is wrong. That is the first thing your verifier checks."}, {"app": "Claude · D1", "title": "T2 · Deliverable 1 — Executive briefing", "scenario": "One page that a director reads in ninety seconds: situation, key findings, recommendation, implementation, expected outcomes, next steps. You write the CTFT prompt from your scenario — Claude drafts, you verify and cut. (~35 min)", "steps": ["Attach your scenario’s data to a new Claude chat — keep this one conversation for the whole capstone.", "Write a full CTFT prompt for a one-page executive briefing with the six sections above.", "Verify every number in the draft against the sheet or the report — the verifier owns this pass.", "Cut it to one page. Recommendation near the top; nothing in it you cannot defend."], "findings": [{"label": "The number a sceptical director will challenge", "hint": "and where it comes from"}, {"label": "One thing Claude got wrong or vague", "hint": "what you fixed"}], "expect": "A one-page briefing where the recommendation leads and every figure traces to your data. Ninety seconds to read, nothing wasted.", "stretch": "Ask Claude to attack it: “What would a sceptical CFO push back on in this briefing?” Fix the two best objections.", "boss": "Write the 60-word version — the summary for the executive who will not read even one page. Same recommendation, nothing lost that matters."}, {"app": "Claude Design / Gamma · D2", "title": "T3 · Deliverable 2 — Stakeholder presentation", "scenario": "Five to six slides that carry your briefing into a room. You compared Claude Design and Gamma yesterday — now pick the one that fits this job and build. (~35 min)", "launches": [{"label": "Open Claude", "href": "https://claude.ai/new", "note": "Claude Design — build the deck in the same conversation as your briefing."}, {"label": "Open Gamma", "href": "https://gamma.app", "note": "Or paste your prompt into Gamma and pick a theme."}], "steps": ["Choose your tool — you earned an opinion on this yesterday. One sentence on why.", "Build 5–6 slides from your briefing, in the same conversation, so Claude keeps the context.", "Check every figure on every slide against the source — a wrong number in a deck travels fastest.", "Fix at least one slide by hand: order, emphasis, or a chart that says it better."], "findings": [{"label": "Which tool, and why", "hint": "one honest sentence"}, {"label": "A figure you verified on a slide", "hint": "number + source"}], "expect": "A 5–6 slide deck that tells the same story as the briefing — title, problem, evidence, recommendation, plan — with every number checked.", "stretch": "Regenerate your evidence slide for a different audience — the tenants, or the front-line team. Notice what has to change, and what must not.", "boss": "Run the same prompt in the other tool and keep whichever deck is honestly better. Be ready to say why in the Q&amp;A."}, {"app": "Claude · D3", "title": "T4 · Deliverable 3 — Data analysis &amp; visualisations", "scenario": "Two to three charts that carry the argument, each with one written insight underneath. Not decoration — evidence. (~25 min)", "steps": ["Decide the two or three claims your initiative stands on. Each gets exactly one chart.", "Ask Claude to build each chart from your workbook, and to show the numbers behind it.", "Verify one number per chart by hand — the verifier recalculates it from the sheet.", "Write one insight sentence under each chart, then drop them into the deck."], "findings": [{"label": "Your charts", "hint": "e.g. “ticket ageing by contractor · occupancy trend”"}, {"label": "The numbers you recalculated by hand", "hint": "one per chart"}], "expect": "Two or three charts, each defending one claim in your briefing, each with a verified number and a one-line insight. If a chart defends nothing, it goes.", "stretch": "Build the counter-chart — the one view of the data that argues against your initiative. Address it in your pitch before the room finds it.", "boss": "Ask Claude to list the exact sheet rows behind every chart. Spot-check two. That citation habit is the single most useful thing you take back to work."}, {"app": "Claude · D4", "title": "T5 · Deliverable 4 — Communication package", "scenario": "The initiative is decided — now it has to land. Pick the two items that fit your scenario’s audience, then bank three reusable prompt templates. (~15 min)", "steps": ["Choose TWO of: an internal email to staff · a public tenant/customer FAQ · a one-page fact sheet.", "Generate both with full CTFT prompts. Same facts as the briefing — no new claims.", "Cross-check the two items against each other and the briefing. One story, three documents.", "Save three prompt templates with [PLACEHOLDERS] — the ones your department would reuse."], "findings": [{"label": "Which two items you chose, and for whom", "hint": "item + audience"}, {"label": "Your three saved templates", "hint": "titles are enough"}], "expect": "Two finished communication items that agree with the briefing on every fact, plus three templates ready for the prompt library you started yesterday.", "stretch": "Take one item and produce it in three lengths — full email, lobby poster, SMS. Same facts, three formats: one more library entry.", "boss": "Draft the answer to the most hostile question your audience could ask — and put it in the FAQ before anyone has to ask it out loud."}, {"app": "Team · Present", "title": "T6 · Assemble, rehearse, present", "scenario": "Assemble the package, run the pitch once out loud, cut what does not earn its place. Six minutes per team, then one question from the room. (~5 min prep · presentations from 11:45)", "steps": ["Assemble: briefing → deck (with charts in) → comms items. One package, one story.", "Run the pitch once, out loud, against the clock: title → problem → evidence → recommendation → implementation &amp; cost → next steps.", "Cut whatever broke the six minutes. Cutting is the last skill of the workshop.", "Decide who takes the Q&amp;A — and prepare your answer to “how do you know?” for your three biggest claims."], "findings": [{"label": "Who presents which section", "hint": "name → section"}, {"label": "Your answer to “how do you know?”", "hint": "for your biggest claim"}], "expect": "A six-minute pitch you have actually run once, a package that tells one consistent story, and a ready answer for the obvious challenge.", "stretch": "Prepare the three-minute emergency version — if the schedule slips, the teams that can compress still land their recommendation.", "boss": "Trade packages with another team for two minutes and find one number in theirs to challenge in Q&amp;A. Expect them to do the same to you."}];
  const KEY='alshaya_ai_day3';
  let state=JSON.parse(localStorage.getItem(KEY)||'{}');
  let cur=0;

  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  const navList=document.getElementById('navList');
  function buildNav(){
    navList.innerHTML='';
    TASKS.forEach((t,i)=>{
      const el=document.createElement('div');
      el.className='nav-item'+(i===cur?' active':'')+((state[i]&&state[i].done)?' done':'');
      el.innerHTML='<span class="ni-n">'+((state[i]&&state[i].done)?'\u2713':(i+1))+'</span><span class="ni-t">'+t.title+'</span>';
      el.onclick=()=>{cur=i;render();window.scrollTo(0,0)};
      navList.appendChild(el);
    });
  }
  function updateProg(){
    const done=Object.values(state).filter(x=>x&&x.done).length;
    document.getElementById('progFill').style.width=(done/TASKS.length*100)+'%';
    document.getElementById('progLabel').textContent=done+' of '+TASKS.length+' done';
  }
  function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

  function datasetBlock(d){
    return `<div class="dataset"><div class="ds-k">Attached data</div>
      <div class="ds-note">${d.note}</div>
      <a class="dl" href="${d.href}" download><span class="ic">\u2b07</span><span>Download workbook<small>${esc(d.label)}</small></span></a>
      <div class="ds-table-wrap"><table class="ds-table">
        <thead><tr>${d.head.map(h=>'<th>'+esc(h)+'</th>').join('')}</tr></thead>
        <tbody>${d.rows.map(r=>'<tr>'+r.map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>').join('')}</tbody>
      </table><div class="ds-more">${esc(d.more||'')}</div></div></div>`;
  }
  function filesBlock(files){
    return `<div class="dataset"><div class="ds-k">Attached file${files.length>1?'s':''}</div>${files.map(f=>
      `<div class="ds-note">${f.note||''}</div><a class="dl" href="${f.href}" download><span class="ic">\u2b07</span><span>Download<small>${esc(f.label)}</small></span></a>`).join('')}</div>`;
  }
  function findVal(k){return (state[cur]&&state[cur].findings&&state[cur].findings[k])||''}
  function findInput(k,f){
    const v=findVal(k);
    return `<label class="find"><span>${esc(f.label)}</span><input class="find-in${v?' filled':''}" data-fk="${k}" placeholder="${esc(f.hint||'')}" value="${String(v).replace(/"/g,'&quot;')}"></label>`;
  }
  function findingsBlock(findings,prefix){
    return `<div class="findings-k">\u270e Record what you found</div><div class="findings">${findings.map((f,i)=>findInput(prefix+'_'+i,f)).join('')}</div>`;
  }
  function goalBlock(g){return `<div class="goal"><div class="gk">Your goal \u2014 build a CTFT prompt for this</div>${esc(g)}</div>`;}
  function revealStep(prompt,si){
    return `<details class="reveal"><summary>\ud83d\udd13 Stuck? Reveal a suggested prompt</summary><div class="prompt psbox" data-ps="${si}"><span class="copy-tag">tap to copy</span>${esc(prompt)}</div></details>`;
  }
  function promptStepsBlock(steps){
    return steps.map((ps,si)=>`<div class="pstep">
      <div class="pstep-h"><span class="pstep-n">${si+1}</span>${esc(ps.label)}</div>
      ${ps.goal?goalBlock(ps.goal):''}
      ${ps.prompt?revealStep(ps.prompt,si):''}
      ${ps.findings?findingsBlock(ps.findings,'s'+si):''}
    </div>`).join('');
  }

  function render(){
    const t=TASKS[cur];const st=state[cur]||{};
    document.getElementById('crumb').textContent='Task '+(cur+1)+' \u00b7 '+t.app;
    const v=document.getElementById('view');
    v.innerHTML=`
      <div class="task-tag"><span class="app">${t.app}</span> Task ${cur+1} of ${TASKS.length}</div>
      <h1 class="task-h">${t.title}</h1>
      <p class="scn">${t.scenario}</p>
      ${t.widget?t.widget:''}
      ${t.dataset?datasetBlock(t.dataset):''}
      ${t.files?filesBlock(t.files):''}
      ${t.launches?t.launches.map(l=>`<a class="launch-btn" href="${l.href}" target="_blank" rel="noopener"><span><b>${esc(l.label)}</b><span class="sub">${esc(l.note||'')}</span></span><span class="ar">\u2192</span></a>`).join(''):''}
      ${(t.prompt||t.promptSteps)?`<div class="ctft-note"><b>Write the prompt yourself.</b> Use <b>CTFT \u2014 Context \u00b7 Task \u00b7 Format \u00b7 Tone</b> to build a prompt that hits each goal below. Stuck? Hit \u201cReveal a suggested prompt\u201d.</div>`:''}
      <div class="step-card"><div class="sc-k">Steps</div><ol>${t.steps.map(s=>'<li>'+s+'</li>').join('')}</ol>
        ${t.goal?goalBlock(t.goal):''}
        ${t.prompt?`<details class="reveal"><summary>\ud83d\udd13 Stuck? Reveal a suggested prompt</summary><div class="prompt" id="promptBox"><span class="copy-tag">tap to copy</span>${esc(t.prompt)}</div></details>`:''}
        ${t.findings?findingsBlock(t.findings,'top'):''}
      </div>
      ${t.promptSteps?promptStepsBlock(t.promptSteps):''}
      <div class="expect"><div class="ex-k">Done looks like</div><p>${t.expect}</p></div>
      ${t.stretch?`<div class="step-card" style="border-left:3px solid var(--rose)"><div class="sc-k">Tier 2 \u00b7 Stretch \u2014 finished early?</div><p style="font-size:14px;color:var(--ink);line-height:1.55">${t.stretch}</p></div>`:''}
      ${t.boss?`<div class="step-card" style="border-left:3px solid var(--gold)"><div class="sc-k" style="color:var(--gold-lt)">Tier 3 \u00b7 Boss Challenge</div><p style="font-size:14px;color:var(--ink);line-height:1.55">${t.boss}</p></div>`:''}
      <div class="capture">
        <label>Paste your Claude result (or a note on how it went)</label>
        <textarea id="note" placeholder="Optional \u2014 saves to your browser so you can review later.">${st.note||''}</textarea>
        <div class="cap-row">
          <button class="cap-btn" id="markDone">${st.done?'Saved \u2713':'Mark done'}</button>
          <span class="cap-done ${st.done?'on':''}" id="capDone">\u2713 Captured</span>
        </div>
      </div>
      <div class="task-foot">
        <button class="tf-btn" id="tfPrev" ${cur===0?'disabled':''}>\u2039 Previous</button>
        <button class="tf-btn next" id="tfNext" ${cur===TASKS.length-1?'disabled':''}>Next task \u203a</button>
      </div>`;

    function flash(el){const tag=el.querySelector('.copy-tag');el.classList.add('copied');
      if(tag){tag.textContent='copied \u2713';setTimeout(()=>{el.classList.remove('copied');tag.textContent='tap to copy'},1500);}
      else setTimeout(()=>el.classList.remove('copied'),1200);}
    function fallback(text,done){const ta=document.createElement('textarea');ta.value=text;
      ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');done()}catch(e){}document.body.removeChild(ta);}
    function copy(text,el){const done=()=>flash(el);
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(text).then(done).catch(()=>fallback(text,done));
      else fallback(text,done);}

    const pb=document.getElementById('promptBox');
    if(pb)pb.onclick=()=>copy(t.prompt,pb);
    v.querySelectorAll('.psbox').forEach(box=>box.onclick=()=>copy(t.promptSteps[+box.dataset.ps].prompt,box));
    v.querySelectorAll('.find-in').forEach(inp=>inp.oninput=e=>{
      state[cur]=state[cur]||{}; state[cur].findings=state[cur].findings||{};
      state[cur].findings[e.target.dataset.fk]=e.target.value; save();
      e.target.classList.toggle('filled', !!e.target.value);
    });
    document.getElementById('markDone').onclick=()=>{
      const note=document.getElementById('note').value;
      state[cur]=Object.assign(state[cur]||{},{done:true,note});save();
      document.getElementById('capDone').classList.add('on');
      document.getElementById('markDone').textContent='Saved \u2713';buildNav();updateProg();
    };
    document.getElementById('note').oninput=e=>{state[cur]=state[cur]||{};state[cur].note=e.target.value;save()};
    const p=document.getElementById('tfPrev'),n=document.getElementById('tfNext');
    if(p)p.onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0)}};
    if(n)n.onclick=()=>{if(cur<TASKS.length-1){cur++;render();window.scrollTo(0,0)}};
    buildNav();updateProg();
  }
  document.getElementById('mPrev').onclick=()=>{if(cur>0){cur--;render();window.scrollTo(0,0)}};
  document.getElementById('mNext').onclick=()=>{if(cur<TASKS.length-1){cur++;render();window.scrollTo(0,0)}};
  document.getElementById('ham').onclick=()=>document.getElementById('rail').classList.toggle('open');
  document.getElementById('resetBtn').onclick=()=>{if(confirm('Clear all your captured notes for Day 3?')){state={};save();cur=0;render()}};
  function goHash(){const m=(location.hash||'').match(/#t(\d+)/);if(m){const n=+m[1]-1;if(n>=0&&n<TASKS.length&&n!==cur){cur=n;render();window.scrollTo(0,0)}}}
  window.addEventListener('hashchange',goHash);
  (function(){const m=(location.hash||'').match(/#t(\d+)/);if(m){const n=+m[1]-1;if(n>=0&&n<TASKS.length)cur=n;}})();
  render();
</script>
</body>
</html>
